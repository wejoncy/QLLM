name: Build release Wheels

on:
  push:
    tags:
      - "v*"
    branches:
      - "fix/ci-build"
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build qllm
    runs-on: ${{ matrix.os }}
    # needs: release
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        pyver: ["3.10", "3.11", "3.12"]
        cuda: ["13.0.0"]
    defaults:
      run:
        shell: pwsh
    env:
      PYPI_CUDA_VERSION: "12.1.1"  
      CUDA_VERSION: ${{ matrix.cuda }}
    
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.0
        if: runner.os == 'Linux'
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
        
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: "build"
          python-version: ${{ matrix.pyver }}
          miniforge-variant: Miniforge3
          miniforge-version: latest
          use-mamba: true
          add-pip-as-python-dependency: true
          auto-activate-base: false

      - name: Install Dependencies
        run: |
          # Install CUDA toolkit
          mamba install -y "cuda=${env:CUDA_VERSION}" "cuda-cudart-dev" "cuda-nvcc" "cuda-cccl" -c "nvidia/label/cuda-${env:CUDA_VERSION}"
          # Env variables
          $env:CUDA_PATH = $env:CONDA_PREFIX
          $env:CUDA_HOME = $env:CONDA_PREFIX
          
          # Install torch
          $cudaVersion = $env:CUDA_VERSION.Replace('.', '')
          $cudaVersionPytorch = $cudaVersion.Substring(0, $cudaVersion.Length - 1)
          if ([int]$cudaVersionPytorch -gt 129) { $pytorchVersion = "torch==2.10.0" } elseif ([int]$cudaVersionPytorch -gt 126) { $pytorchVersion = "torch==2.7.0" } elseif ([int]$cudaVersionPytorch -gt 121) { $pytorchVersion = "torch==2.5.1" } else {$pytorchVersion = "torch==2.4.1"}
          echo "pytorchVersion=$pytorchVersion"
          echo "cudaVersion=<$cudaVersion>"
          echo "cudaVersionPytorch=$cudaVersionPytorch"
          python -m pip install --upgrade --no-cache-dir $pytorchVersion+cu$cudaVersionPytorch --index-url https://download.pytorch.org/whl/cu$cudaVersionPytorch
          python -m pip install build setuptools==69.5.1 wheel ninja
          # Print version information
          python --version
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA:', torch.version.cuda)"
          python -c "import os; print('CUDA_HOME:', os.getenv('CUDA_HOME', None))"
          python -c "from torch.utils import cpp_extension; print (cpp_extension.CUDA_HOME)"
      - name: Build Wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CUDA_PATH=$CONDA_PREFIX
          export CUDA_HOME=$CONDA_PREFIX
          
          # Find thrust include dir
          THRUST_H=$(find $CONDA_PREFIX -path '*/thrust/complex.h' 2>/dev/null | head -1)
          if [ -n "$THRUST_H" ]; then
            CUDA_INCLUDE=$(dirname $(dirname "$THRUST_H"))
            echo "Found thrust in: $CUDA_INCLUDE"
            export CXXFLAGS="-I$CUDA_INCLUDE"
            export CFLAGS="-I$CUDA_INCLUDE"
            # Check if this dir has bin/nvcc
            CUDA_BASE=$(dirname "$CUDA_INCLUDE")
            if [ -f "$CUDA_BASE/bin/nvcc" ]; then
              export CUDA_HOME=$CUDA_BASE
              export CUDA_PATH=$CUDA_BASE
            fi
          fi
          echo "CUDA_HOME=$CUDA_HOME"
          echo "CXXFLAGS=$CXXFLAGS"
          
          export GENERAL_TORCH=1
          python setup.py sdist bdist_wheel -k --plat-name manylinux2014_x86_64
          ls dist/*.whl

      - name: Build Wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:CUDA_PATH = $env:CONDA_PREFIX
          $env:CUDA_HOME = $env:CONDA_PREFIX
          
          # Find nvcc.exe and set CUDA_HOME
          $nvcc = Get-ChildItem -Path $env:CONDA_PREFIX -Recurse -Filter "nvcc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nvcc) {
            $cudaDir = Split-Path (Split-Path $nvcc.FullName)
            echo "Setting CUDA_HOME to $cudaDir"
            $env:CUDA_HOME = $cudaDir
            $env:CUDA_PATH = $cudaDir
          }
          
          if ( $env:CUDA_VERSION -eq $env:PYPI_CUDA_VERSION ){
            $env:PYPI_BUILD = 1
          }
          $env:GENERAL_TORCH = 1
          $env:DISTUTILS_USE_SDK = 1
          python setup.py sdist bdist_wheel -k --plat-name win_amd64
          ls dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: 'wheels_${{runner.os}}_${{matrix.pyver}}_${{matrix.cuda}}'
          path: ./dist/*.whl
          overwrite: true

  release:
    # Retrieve tag and create release	
    name: Create Release	
    runs-on: ubuntu-latest	
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    outputs:	
      upload_url: ${{ steps.create_release.outputs.upload_url }}	
    steps:	
      - name: Checkout	
        uses: actions/checkout@v4	

      - name: Extract branch info	
        shell: bash	
        run: |	
          echo "release_tag=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV	
      - name: Create Release	
        id: create_release	
        uses: "actions/github-script@v6"	
        env:	
          RELEASE_TAG: ${{ env.release_tag }}	
        with:	
          github-token: "${{ secrets.GITHUB_TOKEN }}"	
          script: |	
            const script = require('.github/workflows/scripts/github_create_release.js')	
            await script(github, context, core)
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels_*
          merge-multiple: true
          path: ./dist/
      - name: Upload Assets
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/*.whl